name: RTL regression

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: rtl-regression-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verilator:
    name: Verilator lint and simulation
    runs-on: ubuntu-24.04
    timeout-minutes: 20

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Install RTL and RISC-V tools
        run: |
          sudo apt-get update
          sudo apt-get install --yes \
            binutils-riscv64-unknown-elf \
            gcc-riscv64-unknown-elf \
            verilator

      - name: Show tool versions
        run: |
          verilator --version
          riscv64-unknown-elf-gcc --version | head -n 1
          make --version | head -n 1

      # The vendored RV32 wrappers include their instruction bodies from the
      # upstream rv64ui/rv64um directories. Those shared sources are excluded
      # from this repository, so restore them at the snapshot's pinned commit.
      - name: Restore pinned riscv-tests shared sources
        env:
          RISCV_TESTS_COMMIT: 447a5fcb8253627ddb5f6a226f64e43463afcdd5
        run: |
          git clone --filter=blob:none --no-checkout \
            https://github.com/riscv-software-src/riscv-tests.git \
            "${RUNNER_TEMP}/riscv-tests"
          git -C "${RUNNER_TEMP}/riscv-tests" fetch --depth 1 origin \
            "${RISCV_TESTS_COMMIT}"
          git -C "${RUNNER_TEMP}/riscv-tests" checkout --detach \
            "${RISCV_TESTS_COMMIT}"
          cp -R "${RUNNER_TEMP}/riscv-tests/isa/rv64ui" \
            third_party/riscv-tests/isa/
          cp -R "${RUNNER_TEMP}/riscv-tests/isa/rv64um" \
            third_party/riscv-tests/isa/

      - name: Run RTL, software, and ISA regression
        run: |
          make -j"$(nproc)" \
            ISA_TRACE_DIR="${RUNNER_TEMP}/isa-traces" \
            test

      - name: Upload ISA failure diagnostics
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: isa-failure-diagnostics
          if-no-files-found: ignore
          retention-days: 14
          path: |
            ${{ runner.temp }}/isa-traces/
            /tmp/rv32im-core-isa-*/*.elf
            /tmp/rv32im-core-isa-*/*.map
            /tmp/rv32im-core-isa-*/*.dump
